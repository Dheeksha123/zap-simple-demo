name: OWASP ZAP Scan

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  zap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Start app
        run: |
          npm start > app.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then
              echo "App is ready"
              exit 0
            fi
            echo "Waiting for app..."
            sleep 2
          done
          echo "App did not start"
          cat app.log
          exit 1

      - name: Run OWASP ZAP scan
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/zap/wrk/:rw" \
            owasp/zap2docker-stable \
            zap-baseline.py -t http://127.0.0.1:3000 \
            -r zap-report.html \
            -J zap-report.json \
            -I

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            zap-report.html
            zap-report.json
